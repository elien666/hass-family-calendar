name: "Familienkalender"
description: "Unser cooler Kalender mit Dashboard"
version: "1.37"
slug: "family-calendar"
init: false
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
ingress: true
ingress_port: 80
panel_icon: mdi:calendar-week
panel_admin: false
panel_title: Kalender
homeassistant_api: true
hassio_api: true
hassio_role: default
options:
  weather:
    enabled: false
    weather_latitude: 53.570
    weather_longitude: 10.091
  garage:
    enabled: false
  laundry:
    enabled: false
    machines: []
  doorbell:
    enabled: false
    cameras: []
  everyday_calendar:
    enabled: false
  calendars: []
  hvv:
    enabled: false
  ev:
    enabled: false
schema:
  weather:
    enabled: bool
    weather_api_key: str?
    weather_latitude: float?
    weather_longitude: float?
  hvv: 
    enabled: bool
    geofox_user: str?
    geofox_secret: str?
  garage:
    enabled: bool
    entity_garage_door: str?
  laundry:
    enabled: bool
    machines:
      - name: str
        entity_id: str
  doorbell:
    enabled: bool
    entity_doorbell: str?
    entity_doorbell_button: str?
    cameras:
      - entity_id: str
        orientation: str?
  go2rtc_base_url: str?
  everyday_calendar:
    enabled: bool
    entity_everyday_calendar: str?
  ev:
    enabled: bool
    entity_preclimate_status: str?
    entity_preclimate_start: str?
    entity_preclimate_stop: str?
    entity_charging_state: str?
    entity_state_of_charge: str?
  calendars:
    - name: str
      icon: str?
