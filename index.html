<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="theme-color" content="#000000"/>
    <meta
            name="description"
            content="HASS Family Calendar"
    />
    <title>Familienkalender</title>
</head>
<body>
<noscript>You need to enable JavaScript to run this app.</noscript>
<div id="root"></div>
<!-- Load runtime configuration from HA add-on (falls back gracefully if not present) -->
<script>
  // Dynamically load config.js with error handling
  // In development, this file doesn't exist and will fail silently
  // In production (add-on), this file is generated by run.sh
  const script = document.createElement('script');
  script.src = './config.js';
  script.onerror = function() {
    // File doesn't exist (development mode) - silently fail
    // The app will fall back to environment variables (VITE_*) automatically
  };
  document.head.appendChild(script);
</script>
<script type="module" src="/src/index.jsx"></script>
</body>
</html>
