name: Build Home Assistant Add-on

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for commit messages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update version in config.yaml
        id: update-version
        shell: bash
        run: |
          # Read current version from config.yaml
          CURRENT_VERSION=$(grep '^version:' add-on/config.yaml | sed 's/version: "\(.*\)"/\1/' | tr -d ' ')
          echo "Current version: $CURRENT_VERSION"
          
          # Parse version parts
          IFS='.' read -ra VERSION_PARTS <<< "$CURRENT_VERSION"
          MAJOR=${VERSION_PARTS[0]}
          MINOR=${VERSION_PARTS[1]}
          PATCH=${VERSION_PARTS[2]}
          
          # Determine if version has patch component
          if [ -z "$PATCH" ]; then
            # MAJOR.MINOR format - increment minor (e.g., 2.0 -> 2.1)
            NEW_VERSION="$MAJOR.$((MINOR + 1))"
          else
            # MAJOR.MINOR.PATCH format - increment patch (e.g., 2.0.1 -> 2.0.2)
            NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
          fi
          
          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          
          # Update config.yaml
          sed -i "s/^version: \".*\"/version: \"$NEW_VERSION\"/" add-on/config.yaml
          echo "Updated add-on/config.yaml with version $NEW_VERSION"

      - name: Update CHANGELOG.md
        id: update-changelog
        shell: bash
        run: |
          # Get current date
          CURRENT_DATE=$(date +%Y-%m-%d)
          
          # Get new version from previous step
          NEW_VERSION="${{ steps.update-version.outputs.new_version }}"
          CURRENT_VERSION="${{ steps.update-version.outputs.current_version }}"
          
          # Extract the last version date from CHANGELOG.md
          LAST_VERSION_LINE=$(grep -m 1 "^\*\*" add-on/CHANGELOG.md || echo "")
          LAST_VERSION_DATE=""
          
          if [ -n "$LAST_VERSION_LINE" ]; then
            # Extract date from the last version line (format: **VERSION - DATE**)
            LAST_VERSION_DATE=$(echo "$LAST_VERSION_LINE" | sed -n 's/.*\*\*[^ ]* - \([0-9-]*\)\*\*.*/\1/p')
          fi
          
          # Get all commits since the last version (not just the latest commit)
          COMMITS=""
          if [ -n "$LAST_VERSION_DATE" ]; then
            # Get commits since the last version date, excluding merge commits
            # Use --no-merges to exclude all merge commits
            COMMITS=$(git log --since="$LAST_VERSION_DATE" --pretty=format:"%s" --no-merges 2>/dev/null || echo "")
          fi
          
          # If no commits found by date or empty, get recent commits as fallback
          if [ -z "$COMMITS" ] || [ -z "$(echo "$COMMITS" | grep -v '^$' | head -1)" ]; then
            # Fallback: get last 100 commits excluding merges
            COMMITS=$(git log --pretty=format:"%s" --no-merges -100 2>/dev/null || echo "")
          fi
          
          # Filter out "Merge pull request" and other merge-related messages
          # Also filter out automated build commits and changelog/version bump commits
          FILTERED_COMMITS=$(echo "$COMMITS" | \
            grep -v -i "merge pull request" | \
            grep -v -i "merge branch" | \
            grep -v -i "merge remote" | \
            grep -v "^Merge " | \
            grep -v "chore: build addon" | \
            grep -v "Update CHANGELOG" | \
            grep -v "Bump version" | \
            grep -v "^$" | \
            awk '!seen[$0]++' | \
            head -100 || echo "")
          
          # If still no commits found, use a default message
          if [ -z "$FILTERED_COMMITS" ] || [ -z "$(echo "$FILTERED_COMMITS" | grep -v '^$' | head -1)" ]; then
            FILTERED_COMMITS="Version $NEW_VERSION"
          fi
          
          # Format commits as a bulleted list
          FORMATTED_COMMITS=$(echo "$FILTERED_COMMITS" | sed 's/^/- /')
          
          # Create new changelog entry
          NEW_ENTRY="**$NEW_VERSION - $CURRENT_DATE**\n\n$FORMATTED_COMMITS\n"
          
          # Replace the entire content of CHANGELOG.md with the new entry
          # This replaces the content instead of just prepending the latest commit
          echo -e "$NEW_ENTRY" > add-on/CHANGELOG.md
          
          COMMIT_COUNT=$(echo "$FILTERED_COMMITS" | grep -v '^$' | wc -l | tr -d ' ')
          echo "Updated add-on/CHANGELOG.md with new entry for version $NEW_VERSION"
          echo "Included $COMMIT_COUNT commits (excluding merge commits and automated messages)"

      - name: Build frontend
        run: pnpm run build

      - name: Check for changes
        id: git-check
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if there are any changes
          if git diff --quiet && git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
            git status
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.has_changes == 'true'
        shell: bash
        run: |
          git add add-on/config.yaml add-on/CHANGELOG.md add-on/dist
          git commit -m "chore: build addon v${{ steps.update-version.outputs.new_version }} [skip ci]"
          git push origin main

