name: Build Home Assistant Add-on

on:
  push:
    tags:
      - 'v*.*.*'  # Matches tags like v2.3.4

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      releases: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for commit messages
          ref: main  # Checkout main branch to commit changes back
          fetch-tags: true  # Fetch tags to reference them

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Extract version from tag
        id: extract-version
        shell: bash
        run: |
          # Extract version from tag (e.g., v2.3.4 -> 2.3.4)
          TAG_NAME="${{ github.ref_name }}"
          VERSION="${TAG_NAME#v}"  # Remove 'v' prefix
          
          echo "Tag: $TAG_NAME"
          echo "Version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Update version in config.yaml
        id: update-version
        shell: bash
        run: |
          VERSION="${{ steps.extract-version.outputs.version }}"
          
          # Read current version from config.yaml
          CURRENT_VERSION=$(grep '^version:' add-on/config.yaml | sed 's/version: "\(.*\)"/\1/' | tr -d ' ')
          echo "Current version: $CURRENT_VERSION"
          echo "New version: $VERSION"
          
          echo "new_version=$VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          
          # Update config.yaml
          sed -i "s/^version: \".*\"/version: \"$VERSION\"/" add-on/config.yaml
          echo "Updated add-on/config.yaml with version $VERSION"

      - name: Update CHANGELOG.md
        id: update-changelog
        shell: bash
        run: |
          # Get current date
          CURRENT_DATE=$(date +%Y-%m-%d)
          
          # Get new version from previous step
          NEW_VERSION="${{ steps.update-version.outputs.new_version }}"
          TAG_NAME="${{ steps.extract-version.outputs.tag_name }}"
          
          # Get commits between the previous tag and this tag
          # Find the previous tag by getting all tags and finding the one before current
          ALL_TAGS=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || echo "")
          PREVIOUS_TAG=""
          
          if [ -n "$ALL_TAGS" ]; then
            # Find the tag that comes before the current tag
            PREVIOUS_TAG=$(echo "$ALL_TAGS" | awk -v current="$TAG_NAME" '
              BEGIN { found=0 }
              $0 == current { found=1; next }
              found && /^v[0-9]+\.[0-9]+\.[0-9]+$/ { print; exit }
            ')
          fi
          
          COMMITS=""
          if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$TAG_NAME" ]; then
            # Get commits between previous tag and current tag, excluding merge commits
            # Try to get commits from the tag range
            COMMITS=$(git log "$PREVIOUS_TAG".."$TAG_NAME" --pretty=format:"%s" --no-merges 2>/dev/null || echo "")
            
            # If that fails or returns empty, try getting commits from the tag's commit
            if [ -z "$COMMITS" ] || [ -z "$(echo "$COMMITS" | grep -v '^$' | head -1)" ]; then
              COMMITS=$(git log "$PREVIOUS_TAG"..HEAD --pretty=format:"%s" --no-merges -100 2>/dev/null || echo "")
            fi
          fi
          
          # Fallback: get recent commits from main if no commits found
          if [ -z "$COMMITS" ] || [ -z "$(echo "$COMMITS" | grep -v '^$' | head -1)" ]; then
            COMMITS=$(git log main --pretty=format:"%s" --no-merges -100 2>/dev/null || echo "")
          fi
          
          # Filter out "Merge pull request" and other merge-related messages
          # Also filter out automated build commits and changelog/version bump commits
          FILTERED_COMMITS=$(echo "$COMMITS" | \
            grep -v -i "merge pull request" | \
            grep -v -i "merge branch" | \
            grep -v -i "merge remote" | \
            grep -v "^Merge " | \
            grep -v "chore: build addon" | \
            grep -v "Update CHANGELOG" | \
            grep -v "Bump version" | \
            grep -v "^$" | \
            awk '!seen[$0]++' | \
            head -100 || echo "")
          
          # If still no commits found, use a default message
          if [ -z "$FILTERED_COMMITS" ] || [ -z "$(echo "$FILTERED_COMMITS" | grep -v '^$' | head -1)" ]; then
            FILTERED_COMMITS="Version $NEW_VERSION"
          fi
          
          # Format commits as a bulleted list
          FORMATTED_COMMITS=$(echo "$FILTERED_COMMITS" | sed 's/^/- /')
          
          # Prepend new changelog entry to existing content
          if [ -f "add-on/CHANGELOG.md" ]; then
            EXISTING_CONTENT=$(cat add-on/CHANGELOG.md)
            NEW_ENTRY="**$NEW_VERSION - $CURRENT_DATE**\n\n$FORMATTED_COMMITS\n\n"
            echo -e "$NEW_ENTRY$EXISTING_CONTENT" > add-on/CHANGELOG.md
          else
            NEW_ENTRY="**$NEW_VERSION - $CURRENT_DATE**\n\n$FORMATTED_COMMITS\n"
            echo -e "$NEW_ENTRY" > add-on/CHANGELOG.md
          fi
          
          COMMIT_COUNT=$(echo "$FILTERED_COMMITS" | grep -v '^$' | wc -l | tr -d ' ')
          echo "Updated add-on/CHANGELOG.md with new entry for version $NEW_VERSION"
          echo "Included $COMMIT_COUNT commits (excluding merge commits and automated messages)"

      - name: Build frontend
        run: pnpm run build

      - name: Check for changes
        id: git-check
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if there are any changes
          if git diff --quiet && git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
            git status
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.has_changes == 'true'
        shell: bash
        run: |
          git add add-on/config.yaml add-on/CHANGELOG.md add-on/dist
          git commit -m "chore: build addon v${{ steps.update-version.outputs.new_version }} [skip ci]"
          git push origin HEAD:main

      - name: Create GitHub Release
        id: create-release
        shell: bash
        run: |
          TAG_NAME="${{ steps.extract-version.outputs.tag_name }}"
          VERSION="${{ steps.update-version.outputs.new_version }}"
          
          # Read CHANGELOG content for release notes
          RELEASE_NOTES=""
          if [ -f "add-on/CHANGELOG.md" ]; then
            # Extract the changelog entry for this version (first entry after update)
            RELEASE_NOTES=$(awk '
              BEGIN { found=0 }
              /^\*\*'"$VERSION"' - / {
                found=1
                next
              }
              found && /^\*\*/ {
                exit
              }
              found {
                print
              }
            ' add-on/CHANGELOG.md)
          fi
          
          # Fallback if no changelog content
          if [ -z "$RELEASE_NOTES" ] || [ -z "$(echo "$RELEASE_NOTES" | grep -v '^$')" ]; then
            RELEASE_NOTES="Release $VERSION"
          fi
          
          # Create GitHub Release
          echo "Creating release $TAG_NAME with version $VERSION"
          gh release create "$TAG_NAME" \
            --title "Release $VERSION" \
            --notes "$RELEASE_NOTES" \
            --target main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

