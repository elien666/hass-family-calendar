name: Build Home Assistant Add-on

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  # Job 0: Run tests (backend + frontend) — only on PRs, not redundantly after merge
  test:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: add-on/backend/requirements*.txt

      - name: Install backend dependencies
        run: |
          pip install -r add-on/backend/requirements.txt
          pip install -r add-on/backend/requirements-test.txt

      - name: Run backend tests
        working-directory: add-on/backend
        run: pytest --no-cov -v

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run frontend tests
        run: pnpm test

      - name: Validate add-on YAML files
        run: |
          pip install pyyaml
          python3 -c "
          import yaml, sys
          files = [
              'add-on/config.yaml',
              'add-on/build.yaml',
              'add-on/translations/en.yaml',
              'add-on/translations/de.yaml',
          ]
          failed = False
          for f in files:
              try:
                  with open(f) as fh:
                      yaml.safe_load(fh)
                  print(f'{f}: OK')
              except Exception as e:
                  print(f'{f}: FAILED - {e}')
                  failed = True
          if failed:
              sys.exit(1)
          "

      - name: Validate S6-overlay structure
        run: |
          ERRORS=0
          check_file() {
            if [ ! -f "$1" ]; then
              echo "MISSING: $1"
              ERRORS=$((ERRORS + 1))
            else
              echo "OK: $1"
            fi
          }
          check_file "add-on/rootfs/etc/s6-overlay/s6-rc.d/family-calendar/run"
          check_file "add-on/rootfs/etc/s6-overlay/s6-rc.d/family-calendar/type"
          check_file "add-on/rootfs/etc/s6-overlay/s6-rc.d/family-calendar/finish"
          check_file "add-on/rootfs/etc/s6-overlay/s6-rc.d/family-calendar/dependencies.d/base"
          check_file "add-on/rootfs/etc/s6-overlay/s6-rc.d/user/contents.d/family-calendar"
          grep -q "longrun" add-on/rootfs/etc/s6-overlay/s6-rc.d/family-calendar/type || { echo "FAIL: type must contain 'longrun'"; ERRORS=$((ERRORS + 1)); }
          test -x add-on/rootfs/etc/s6-overlay/s6-rc.d/family-calendar/run || { echo "FAIL: run must be executable"; ERRORS=$((ERRORS + 1)); }
          if [ $ERRORS -gt 0 ]; then echo "$ERRORS error(s) found"; exit 1; fi
          echo "S6-overlay structure: OK"

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: add-on/Dockerfile

  # Job 1: Build check for PRs to main - validate and write back to PR branch
  build-check:
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'main'
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch full history for commit messages
          ref: ${{ github.head_ref }}  # Checkout PR branch
          fetch-tags: true  # Fetch tags to reference them

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Calculate version
        id: calculate-version
        shell: bash
        run: |
          # Semantic Versioning: MAJOR.MINOR.PATCH
          # Bump rules (conventional commits):
          #   feat: or feat(scope): → MINOR++, PATCH=0
          #   anything else         → PATCH++

          # Determine bump type from conventional commits since last tag
          PREVIOUS_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | head -1 || echo "")
          HAS_FEAT="false"
          if [ -n "$PREVIOUS_TAG" ]; then
            FEAT_COUNT=$(git log "$PREVIOUS_TAG"..HEAD --pretty=format:"%s" --no-merges | grep -ciE '^feat(\(.+\))?:' || echo "0")
            if [ "$FEAT_COUNT" -gt 0 ]; then
              HAS_FEAT="true"
              echo "Found $FEAT_COUNT feat: commit(s) → minor bump"
            else
              echo "No feat: commits → patch bump"
            fi
          fi

          # Load major version from repo
          MAJOR_VERSION=""
          if [ -f "VERSION" ]; then
            VERSION_CONTENT=$(cat VERSION | tr -d ' \n')
            MAJOR_VERSION=$(echo "$VERSION_CONTENT" | sed 's/^v*\([0-9]*\).*/\1/' | grep -oE '^[0-9]+' || echo "")
          fi

          # If no VERSION file or empty, get major version from latest tag
          if [ -z "$MAJOR_VERSION" ] || [ "$MAJOR_VERSION" = "0" ]; then
            # Match both vX.Y and vX.Y.Z tag formats
            LATEST_TAG=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | head -1 || echo "")

            if [ -n "$LATEST_TAG" ]; then
              MAJOR_VERSION=$(echo "$LATEST_TAG" | sed 's/^v\([0-9]*\)\..*/\1/')
            else
              MAJOR_VERSION="1"
            fi
          fi

          # Ensure MAJOR_VERSION is a valid number
          if ! echo "$MAJOR_VERSION" | grep -qE '^[0-9]+$'; then
            echo "Invalid major version: $MAJOR_VERSION, defaulting to 1"
            MAJOR_VERSION="1"
          fi

          echo "Major version: $MAJOR_VERSION"

          # Find highest existing version for this major version
          # Match both vX.Y and vX.Y.Z tag formats
          TAGS_FOR_MAJOR=$(git tag --sort=-version:refname | grep -E "^v${MAJOR_VERSION}\.[0-9]+(\.[0-9]+)?$" || echo "")

          MINOR_VERSION=0
          PATCH_VERSION=0
          if [ -n "$TAGS_FOR_MAJOR" ]; then
            HIGHEST_TAG=$(echo "$TAGS_FOR_MAJOR" | head -1)

            # Check if tag has patch version (vX.Y.Z vs vX.Y)
            if echo "$HIGHEST_TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              # Three-part tag: extract minor and patch
              MINOR_VERSION=$(echo "$HIGHEST_TAG" | sed 's/^v[0-9]*\.\([0-9]*\)\.[0-9]*$/\1/')
              PATCH_VERSION=$(echo "$HIGHEST_TAG" | sed 's/^v[0-9]*\.[0-9]*\.\([0-9]*\)$/\1/')
              if [ "$HAS_FEAT" = "true" ]; then
                # feat: commit → minor bump, reset patch
                MINOR_VERSION=$((MINOR_VERSION + 1))
                PATCH_VERSION=0
              elif echo "$PATCH_VERSION" | grep -qE '^[0-9]+$'; then
                PATCH_VERSION=$((PATCH_VERSION + 1))
              else
                PATCH_VERSION=0
              fi
            else
              # Two-part legacy tag: increment minor, start patch at 0
              MINOR_VERSION=$(echo "$HIGHEST_TAG" | sed 's/^v[0-9]*\.\([0-9]*\)$/\1/')
              if echo "$MINOR_VERSION" | grep -qE '^[0-9]+$'; then
                MINOR_VERSION=$((MINOR_VERSION + 1))
              else
                MINOR_VERSION=0
              fi
              PATCH_VERSION=0
            fi
          fi

          # Construct new semantic version
          NEW_VERSION="${MAJOR_VERSION}.${MINOR_VERSION}.${PATCH_VERSION}"
          TAG_NAME="v${NEW_VERSION}"

          echo "New version: $NEW_VERSION"
          echo "Tag name: $TAG_NAME"
          echo "version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "major_version=$MAJOR_VERSION" >> $GITHUB_OUTPUT
          echo "minor_version=$MINOR_VERSION" >> $GITHUB_OUTPUT
          echo "patch_version=$PATCH_VERSION" >> $GITHUB_OUTPUT

      - name: Update version in config.yaml
        id: update-version
        shell: bash
        run: |
          VERSION="${{ steps.calculate-version.outputs.version }}"
          TAG_NAME="${{ steps.calculate-version.outputs.tag_name }}"
          
          # Read current version from config.yaml
          CURRENT_VERSION=$(grep '^version:' add-on/config.yaml | sed 's/version: "\(.*\)"/\1/' | tr -d ' ')
          echo "Current version: $CURRENT_VERSION"
          echo "New version: $VERSION"
          echo "Tag name: $TAG_NAME"
          
          echo "new_version=$VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          
          # Update config.yaml
          sed -i "s/^version: \".*\"/version: \"$VERSION\"/" add-on/config.yaml
          echo "Updated add-on/config.yaml with version $VERSION"

      - name: Update CHANGELOG.md
        id: update-changelog
        shell: bash
        run: |
          # Get current date
          CURRENT_DATE=$(date +%Y-%m-%d)
          
          # Get new version from previous step
          NEW_VERSION="${{ steps.update-version.outputs.new_version }}"
          TAG_NAME="${{ steps.update-version.outputs.tag_name }}"
          
          # Get commits between the previous tag and HEAD
          # Find the latest existing tag (previous release) matching vX.Y or vX.Y.Z
          ALL_TAGS=$(git tag --sort=-version:refname | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' || echo "")
          PREVIOUS_TAG=""
          
          if [ -n "$ALL_TAGS" ]; then
            # Get the latest existing tag (first in sorted descending list)
            # This is the previous release since we're creating a new version
            PREVIOUS_TAG=$(echo "$ALL_TAGS" | head -1)
          fi
          
          COMMITS=""
          if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "$TAG_NAME" ]; then
            # Get commits between previous tag and HEAD, excluding merge commits
            # This gets only commits since the previous release
            COMMITS=$(git log "$PREVIOUS_TAG"..HEAD --pretty=format:"%s" --no-merges 2>/dev/null || echo "")
          else
            # No previous tag exists, this is the first release - get all commits from the branch
            COMMITS=$(git log --pretty=format:"%s" --no-merges 2>/dev/null || echo "")
          fi
          
          # Filter out "Merge pull request" and other merge-related messages
          # Also filter out automated build commits and changelog/version bump commits
          FILTERED_COMMITS=$(echo "$COMMITS" | \
            grep -v -i "merge pull request" | \
            grep -v -i "merge branch" | \
            grep -v -i "merge remote" | \
            grep -v "^Merge " | \
            grep -v "chore: build addon" | \
            grep -v "Update CHANGELOG" | \
            grep -v "Bump version" | \
            grep -v "^$" | \
            awk '!seen[$0]++' | \
            head -100 || echo "")
          
          # If still no commits found, use a default message
          if [ -z "$FILTERED_COMMITS" ] || [ -z "$(echo "$FILTERED_COMMITS" | grep -v '^$' | head -1)" ]; then
            FILTERED_COMMITS="Version $NEW_VERSION"
          fi

          # Group commits by conventional commit type
          FEATURES=$(echo "$FILTERED_COMMITS" | grep -iE '^feat(\(.+\))?:' || true)
          FIXES=$(echo "$FILTERED_COMMITS" | grep -iE '^fix(\(.+\))?:' || true)
          OTHER=$(echo "$FILTERED_COMMITS" | grep -viE '^(feat|fix)(\(.+\))?:' || true)

          FORMATTED_COMMITS=""
          if [ -n "$FEATURES" ] && [ -n "$(echo "$FEATURES" | grep -v '^$')" ]; then
            FORMATTED_COMMITS+="### Features\n$(echo "$FEATURES" | sed 's/^/- /')\n\n"
          fi
          if [ -n "$FIXES" ] && [ -n "$(echo "$FIXES" | grep -v '^$')" ]; then
            FORMATTED_COMMITS+="### Fixes\n$(echo "$FIXES" | sed 's/^/- /')\n\n"
          fi
          if [ -n "$OTHER" ] && [ -n "$(echo "$OTHER" | grep -v '^$')" ]; then
            FORMATTED_COMMITS+="### Other\n$(echo "$OTHER" | sed 's/^/- /')\n\n"
          fi

          # Fallback if grouping produced nothing
          if [ -z "$FORMATTED_COMMITS" ]; then
            FORMATTED_COMMITS="$(echo "$FILTERED_COMMITS" | sed 's/^/- /')\n"
          fi

          # Overwrite CHANGELOG with only the current release entry
          NEW_ENTRY="**$NEW_VERSION - $CURRENT_DATE**\n\n$FORMATTED_COMMITS"
          echo -e "$NEW_ENTRY" > add-on/CHANGELOG.md
          
          COMMIT_COUNT=$(echo "$FILTERED_COMMITS" | grep -v '^$' | wc -l | tr -d ' ')
          echo "Updated add-on/CHANGELOG.md with new entry for version $NEW_VERSION"
          echo "Included $COMMIT_COUNT commits (excluding merge commits and automated messages)"

      - name: Build frontend
        run: pnpm run build

      - name: Check for changes
        id: git-check
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if there are any changes
          if git diff --quiet && git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
            git status
          fi

      - name: Commit and push changes to PR branch
        if: steps.git-check.outputs.has_changes == 'true'
        shell: bash
        run: |
          git add add-on/config.yaml add-on/CHANGELOG.md add-on/dist
          git commit -m "chore: build addon v${{ steps.update-version.outputs.new_version }} [skip ci]"
          git push origin HEAD:${{ github.head_ref }}

  # Job 2: Create release on push to main (after PR merge) - NO build
  release:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !contains(github.event.head_commit.message, '[skip ci]')
    permissions:
      contents: write
    needs: []  # No dependencies - this runs independently after PR merge
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Fetch full history for commit messages
          ref: main  # Checkout main branch
          fetch-tags: true  # Fetch tags to reference them

      - name: Read version from config.yaml
        id: read-version
        shell: bash
        run: |
          # Read current version from config.yaml that was set during PR build
          VERSION=$(grep '^version:' add-on/config.yaml | sed 's/version: "\(.*\)"/\1/' | tr -d ' ')
          
          if [ -z "$VERSION" ]; then
            echo "Error: Could not read version from config.yaml"
            exit 1
          fi
          
          TAG_NAME="v${VERSION}"
          
          echo "Version from config.yaml: $VERSION"
          echo "Tag name: $TAG_NAME"
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Create and push git tag
        id: create-tag
        shell: bash
        run: |
          # Configure git identity
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          TAG_NAME="${{ steps.read-version.outputs.tag_name }}"
          VERSION="${{ steps.read-version.outputs.version }}"
          
          # Ensure we're on main branch
          git checkout main || true
          
          # Check if tag already exists remotely
          if git ls-remote --tags origin "$TAG_NAME" | grep -q "$TAG_NAME"; then
            echo "Tag $TAG_NAME already exists on remote, skipping tag creation"
            echo "tag_created=false" >> $GITHUB_OUTPUT
          elif git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
            echo "Tag $TAG_NAME already exists locally, skipping tag creation"
            echo "tag_created=false" >> $GITHUB_OUTPUT
          else
            # Create and push the tag on the current HEAD (the merged PR commit)
            git tag -a "$TAG_NAME" -m "Release $VERSION"
            git push origin "$TAG_NAME"
            echo "Created and pushed tag $TAG_NAME"
            echo "tag_created=true" >> $GITHUB_OUTPUT
          fi
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        id: create-release
        if: steps.create-tag.outputs.tag_created == 'true'
        shell: bash
        run: |
          TAG_NAME="${{ steps.create-tag.outputs.tag_name }}"
          VERSION="${{ steps.read-version.outputs.version }}"
          
          # Read CHANGELOG content for release notes
          RELEASE_NOTES=""
          if [ -f "add-on/CHANGELOG.md" ]; then
            # Extract the changelog entry for this version (first entry after update)
            RELEASE_NOTES=$(awk '
              BEGIN { found=0 }
              /^\*\*'"$VERSION"' - / {
                found=1
                next
              }
              found && /^\*\*/ {
                exit
              }
              found {
                print
              }
            ' add-on/CHANGELOG.md)
          fi
          
          # Fallback if no changelog content
          if [ -z "$RELEASE_NOTES" ] || [ -z "$(echo "$RELEASE_NOTES" | grep -v '^$')" ]; then
            RELEASE_NOTES="Release $VERSION"
          fi
          
          # Create GitHub Release
          echo "Creating release $TAG_NAME with version $VERSION"
          gh release create "$TAG_NAME" \
            --title "Release $VERSION" \
            --notes "$RELEASE_NOTES" \
            --target main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Job 3: Build and push Docker images to GHCR after release
  publish-images:
    runs-on: ubuntu-latest
    needs: release
    if: always() && needs.release.result == 'success'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - arch: aarch64
            platform: linux/arm64
          - arch: amd64
            platform: linux/amd64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Read version from config.yaml
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version:' add-on/config.yaml | sed 's/version: "\(.*\)"/\1/' | tr -d ' ')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Read base image for architecture
        id: base
        shell: bash
        run: |
          pip install pyyaml
          BASE=$(python3 -c "
          import yaml
          with open('add-on/build.yaml') as f:
              data = yaml.safe_load(f)
          print(data['build_from']['${{ matrix.arch }}'])
          ")
          echo "base_image=$BASE" >> $GITHUB_OUTPUT

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: add-on
          file: add-on/Dockerfile
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            BUILD_FROM=${{ steps.base.outputs.base_image }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/family-calendar/${{ matrix.arch }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/family-calendar/${{ matrix.arch }}:latest
