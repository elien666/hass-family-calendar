name: Build Staging Release

on:
  push:
    branches:
      - develop

jobs:
  build-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch full history for commit messages

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine build number and staging version
        id: version-info
        shell: bash
        run: |
          # Read current version from config.yaml
          CURRENT_VERSION=$(grep '^version:' add-on/config.yaml | sed 's/version: "\(.*\)"/\1/' | tr -d ' ')
          echo "Current version in config.yaml: $CURRENT_VERSION"
          
          # Get build number from GitHub Actions run number
          BUILD_NUMBER="${{ github.run_number }}"
          
          # Construct staging version: next-<build>
          STAGING_VERSION="next-${BUILD_NUMBER}"
          
          echo "Build number: $BUILD_NUMBER"
          echo "Staging version: $STAGING_VERSION"
          
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "staging_version=$STAGING_VERSION" >> $GITHUB_OUTPUT
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

      - name: Update version in config.yaml
        id: update-version
        shell: bash
        run: |
          STAGING_VERSION="${{ steps.version-info.outputs.staging_version }}"
          CURRENT_VERSION="${{ steps.version-info.outputs.current_version }}"
          
          echo "Updating version from $CURRENT_VERSION to $STAGING_VERSION"
          
          # Update config.yaml
          sed -i "s/^version: \".*\"/version: \"$STAGING_VERSION\"/" add-on/config.yaml
          echo "Updated add-on/config.yaml with version $STAGING_VERSION"
          
          echo "new_version=$STAGING_VERSION" >> $GITHUB_OUTPUT

      - name: Update CHANGELOG.md
        id: update-changelog
        shell: bash
        run: |
          # Get current date
          CURRENT_DATE=$(date +%Y-%m-%d)
          
          # Get new version from previous step
          NEW_VERSION="${{ steps.update-version.outputs.new_version }}"
          BUILD_NUMBER="${{ steps.version-info.outputs.build_number }}"
          
          # Get recent commits on develop branch, excluding merge commits
          COMMITS=$(git log --pretty=format:"%s" --no-merges -50 2>/dev/null || echo "")
          
          # Filter out "Merge pull request" and other merge-related messages
          # Also filter out automated build commits and changelog/version bump commits
          FILTERED_COMMITS=$(echo "$COMMITS" | \
            grep -v -i "merge pull request" | \
            grep -v -i "merge branch" | \
            grep -v -i "merge remote" | \
            grep -v "^Merge " | \
            grep -v "chore: build addon" | \
            grep -v "chore: build staging" | \
            grep -v "Update CHANGELOG" | \
            grep -v "Bump version" | \
            grep -v "^$" | \
            awk '!seen[$0]++' | \
            head -50 || echo "")
          
          # If still no commits found, use a default message
          if [ -z "$FILTERED_COMMITS" ] || [ -z "$(echo "$FILTERED_COMMITS" | grep -v '^$' | head -1)" ]; then
            FILTERED_COMMITS="Staging build $BUILD_NUMBER"
          fi
          
          # Format commits as a bulleted list
          FORMATTED_COMMITS=$(echo "$FILTERED_COMMITS" | sed 's/^/- /')
          
          # Create staging changelog entry
          NEW_ENTRY="**$NEW_VERSION - $CURRENT_DATE**\n\n_Staging build_\n\n$FORMATTED_COMMITS\n"
          
          # Prepend new changelog entry to existing content
          if [ -f "add-on/CHANGELOG.md" ]; then
            EXISTING_CONTENT=$(cat add-on/CHANGELOG.md)
            echo -e "$NEW_ENTRY\n$EXISTING_CONTENT" > add-on/CHANGELOG.md
          else
            echo -e "$NEW_ENTRY" > add-on/CHANGELOG.md
          fi
          
          COMMIT_COUNT=$(echo "$FILTERED_COMMITS" | grep -v '^$' | wc -l | tr -d ' ')
          echo "Updated add-on/CHANGELOG.md with new staging entry for version $NEW_VERSION"
          echo "Included $COMMIT_COUNT commits (excluding merge commits and automated messages)"

      - name: Build frontend
        run: pnpm run build

      - name: Check for changes
        id: git-check
        shell: bash
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          # Check if there are any changes
          if git diff --quiet && git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No changes to commit"
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"
            git status
          fi

      - name: Commit and push changes
        if: steps.git-check.outputs.has_changes == 'true'
        shell: bash
        run: |
          git add add-on/config.yaml add-on/CHANGELOG.md add-on/dist
          git commit -m "chore: build staging addon ${{ steps.update-version.outputs.new_version }} [skip ci]"
          git push origin develop

